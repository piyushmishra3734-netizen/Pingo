# Supabase configuration for PINGO.
#
# Source of truth for `supabase start` (local development) and for
# `supabase config push` on a linked project. The hosted project's dashboard
# must match; `README.md` in this directory lists the settings that matter and
# why each one is load-bearing.
#
# Three doors, all password- or provider-based (docs/01 § 1). **No OTP
# anywhere** — the verification step in § 6.3 was removed, along with its
# screens, so any setting that would make Supabase send a code or a link is
# switched off here on purpose.

project_id = "pingo"

[auth]
# Where the app runs in development. OAuth redirects are resolved against this.
site_url = "http://localhost:5173"
# Both schemes: plain `vite preview` serves http, `vite dev` serves https
# (basicSsl) - and Supabase drops a redirect target whose scheme is not
# allowlisted, bouncing the user to the production Site URL instead. That
# bounce is what "login on localhost lands on real Pingo" was.
additional_redirect_urls = ["http://localhost:5173", "http://localhost:5173/auth/google", "https://localhost:5173", "https://localhost:5173/auth/google"]

# Sessions persist indefinitely while the device is trusted (docs/01 § 18).
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

enable_signup = true
enable_anonymous_sign_ins = false

# Password rules are enforced in `packages/core/password-policy.ts` (10 chars,
# not common, letters and numbers). This is the backend's floor, kept lower so
# the product's rule is the one users actually meet.
minimum_password_length = 8

# Lives under [auth], not [auth.email]: the CLI moved it, and in the wrong
# section the whole config fails to parse and every db push stops before it
# starts.

[auth.email]
enable_signup = true

# ⚠️ Load-bearing. On, Supabase returns `session: null` from `signUp` and waits
# for a confirmation link — and this product has no screen to wait on, so the
# user would be stranded one step from Home. `SupabaseAuthService.assertSession`
# turns that state into an explicit error rather than a silent hang.
enable_confirmations = false

# Re-authentication before sensitive changes uses a password, never an OTP
# (docs/01 § 18).
secure_password_change = true

# Left off deliberately. Phone sign-in runs on a derived address through the
# email provider, because Supabase will not enable this one without paid SMS
# credentials it would never use. See README.md → "Phone sign-in does not use
# Supabase's phone provider".
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
# Where Google returns the browser. `GoogleConnectingScreen` serves both legs.
redirect_uri = "http://localhost:5173/auth/google"

# The only endpoint in the product that runs without a JWT, and it has to: the
# caller is signing in and does not have one yet. It refuses everything except
# a username and a password that already match, and never reveals which of the
# two was wrong. See the header of `functions/username-login/index.ts`.
[functions.username-login]
verify_jwt = false

# Recovery by @username: the caller is locked out, so there is no session to
# verify. See the function header.
[functions.password-recovery]
verify_jwt = false

# Called by Postgres, which has no user session to verify. The check is the
# service-role key in the Authorization header, compared in constant time -
# see the header of `functions/push-send/index.ts`.
[functions.push-send]
verify_jwt = false

# Called by `media_sweeper_tick()` from pg_cron, which has no user session. The
# check is a shared secret compared in constant time - see the header of
# `functions/purge-media/index.ts`.
[functions.purge-media]
verify_jwt = false

# A browser cannot set headers on a WebSocket, so the platform's check - which
# reads a header - can never pass for this one. The JWT arrives as a query
# parameter and is verified in code before Sarvam is dialled at all; see the
# header of `functions/stt-stream/index.ts`.
#
# It was set on the dashboard and not here, which meant the next `functions
# deploy` would have quietly turned verification back on and taken every voice
# call down with it. The repo is the record.
[functions.stt-stream]
verify_jwt = false

# The same drift as `stt-stream`, found the same way and twice over.
#
# Both of these have had `verify_jwt = false` on the deployed project since they
# were written, and neither was ever written down here. Migrating to a new
# project made that visible: a plain `functions deploy` would have created them
# with verification on, and the failure is not obvious from the outside - the
# platform rejects the request before either function runs, so the logs that
# would explain it are the logs of a function that was never entered.
#
# Neither is unauthenticated. Both read the `Authorization` header and establish
# the user themselves - `ai-chat` builds a user-scoped client from it, and
# `turn-credentials` asks the Auth API rather than decoding the token locally.
# The platform check is off so that they can answer in their own shape; the
# check itself still happens.
[functions.ai-chat]
verify_jwt = false

[functions.turn-credentials]
verify_jwt = false

# Live streaming. Same shape as `livekit-token`: the browser cannot join a room
# without a signed grant, and the grant is authorised against `live_streams`
# with the caller's own JWT in code - host publishes, mutual viewers subscribe.
[functions.live-token]
verify_jwt = false

# Called by Supabase Auth, which has no user session to verify - the same shape
# as push-send. What replaces the JWT is a Standard Webhooks signature over the
# raw body, checked before the payload is parsed, and without it the endpoint is
# an open SMS sender pointed at a paid account.
#
# Written here rather than set on the dashboard, which is the mistake this file
# has now recorded three times: a setting that lives only in the dashboard is
# one `functions deploy` away from being silently reversed, and the failure is
# unreadable - the platform rejects the request before the function runs, so the
# logs that would explain it belong to a function that was never entered.
[functions.send-sms]
verify_jwt = false
