<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to PINGO</title>
<style>
  :root { color-scheme: light dark; --bg: #FBFBFE; --ink: #16151c; --soft: #6b6878; --brand: #e0559b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f0e13; --ink: #f3f2f7; --soft: #a3a0ae; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { text-align: center; padding: 24px; max-width: 360px; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--soft); margin: 0 0 20px; }
  a { display: inline-block; background: var(--brand); color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/pingo-icon.png" alt="">
  <h1>You're signed in</h1>
  <p>Going back to PINGO on your computer. You can close this tab.</p>
  <a id="open" href="#">Open PINGO</a>
</main>
<script>
  // The code goes to the desktop app, which holds the other half of this sign-in.
  var link = 'pingo://auth' + location.search;
  document.getElementById('open').href = link;
  location.href = link;
</script>
</body>
</html>
