<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>PINGO. Connect. Privately.</title>
    <meta
      name="description"
      content="Private messaging with disappearing Pings, stories that expire, and a profile that holds three posts. Connect privately on web and mobile."
    />
    <link rel="canonical" href="https://pingochat.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PINGO" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="PINGO. Connect. Privately." />
    <meta
      property="og:description"
      content="Private messaging with disappearing Pings, stories that expire, and a profile that holds three posts. Connect privately on web and mobile."
    />
    <meta property="og:url" content="https://pingochat.pages.dev/" />
    <meta property="og:image" content="https://pingochat.pages.dev/pingo-maskable.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="PINGO app icon" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="PINGO. Connect. Privately." />
    <meta
      name="twitter:description"
      content="Private messaging with disappearing Pings, stories that expire, and a profile that holds three posts. Connect privately on web and mobile."
    />
    <meta name="twitter:url" content="https://pingochat.pages.dev/" />
    <meta name="twitter:image" content="https://pingochat.pages.dev/pingo-maskable.png" />
    <meta name="twitter:image:alt" content="PINGO app icon" />

    <!-- Tints browser chrome to the page colour so the app has no visible seam. -->
    <meta name="theme-color" content="#FBFBFE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      The name under the icon on an iPhone's home screen.

      iOS ignores the manifest's `short_name` and uses `<title>` unless this is
      here - so the icon was labelled "PINGO. Connect. Privately." and iOS
      truncated it to about twelve characters of tagline.
    -->
    <meta name="apple-mobile-web-app-title" content="PINGO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Space Grotesk is the brand face, served from our own origin.

      It used to come from fonts.googleapis.com, which meant Google received an
      IP address for every visitor on every cold load - before sign-in, before
      anything at all. On a product whose argument is that the middle is empty,
      that was the one request contradicting it, and the privacy policy would
      have had to list Google as a third party purely because of a typeface.

      Preloaded rather than merely linked: the @font-face lives in an imported
      stylesheet, so without this the browser cannot discover the font until CSS
      has parsed - a round trip that lands squarely in first paint. The latin
      subset only; the others are fetched on demand by their unicode-range and
      most sessions never need them.

      Licensed under the SIL Open Font License. See /fonts/OFL.txt.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Hero mark used on public landing surfaces; warm the cache for LCP. -->
    <link rel="preload" href="/pingo-icon.png" as="image" type="image/png" />

    <!--
      The official artwork, used as supplied. Three files, all generated by
      `scripts/icons.mjs` from the one image, because the same picture is wrong
      in each of these places for a different reason.

      The tab takes the penguin alone. Cutting the paper away still leaves the
      tile, and the tile is a pale glass square - which in a tab is a white box
      with a bird in it, whatever the surrounding chrome is doing. Only the mark
      belongs there.

      `apple-touch-icon` takes the opaque, full-bleed copy. iOS ignores
      transparency here and composites onto black, so a transparent PNG arrives
      with black wedges in its corners - and iOS rounds the icon itself anyway,
      so the tile's own corners would be cropped twice.

      The social cards take the same opaque copy, for the same reason in a
      different setting: a transparent PNG lands on whatever colour the app
      showing the link happens to use.
    -->
    <link rel="icon" href="/pingo-favicon.png" type="image/png" sizes="512x512" />
    <link rel="icon" href="/pingo-favicon.png" type="image/png" sizes="any" />
    <link rel="shortcut icon" href="/pingo-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pingo-maskable.png" sizes="512x512" />

    <!-- JSON-LD: organization + software application (public product surface). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pingochat.pages.dev/#organization",
            "name": "PINGO",
            "url": "https://pingochat.pages.dev/",
            "logo": "https://pingochat.pages.dev/pingo-icon.png",
            "description": "Private messaging, redefined for you."
          },
          {
            "@type": "WebSite",
            "@id": "https://pingochat.pages.dev/#website",
            "name": "PINGO",
            "url": "https://pingochat.pages.dev/",
            "description": "Private messaging with disappearing Pings, stories that expire, and a profile that holds three posts.",
            "publisher": { "@id": "https://pingochat.pages.dev/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://pingochat.pages.dev/#app",
            "name": "PINGO",
            "applicationCategory": "CommunicationApplication",
            "operatingSystem": "Web, Android",
            "url": "https://pingochat.pages.dev/download",
            "image": "https://pingochat.pages.dev/pingo-icon.png",
            "description": "Private messaging with disappearing Pings, stories that expire, and a profile that holds three posts.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "publisher": { "@id": "https://pingochat.pages.dev/#organization" }
          }
        ]
      }
    </script>
    <!--
      The theme, decided before the first pixel.

      `data-theme` is set by SettingsContext, which cannot run until React has
      mounted - so a reload painted the light palette and then turned dark once
      the bundle was parsed. Every deploy reloads the fleet (`autoUpdate` with
      `skipWaiting`), so this was fifteen flashes a day for anybody on dark.

      Reads the same key and the same rule the app does: an explicit choice
      wins, `auto` follows the system. Wrapped because a browser refusing
      localStorage must cost the flash, not the app.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pingo:preferences');
          var theme = raw ? (JSON.parse(raw) || {}).theme : 'auto';
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            var tint = document.querySelector('meta[name="theme-color"]');
            if (tint) tint.setAttribute('content', '#0c0d11');
          }
        } catch (error) {
          /* No preference readable. The stylesheet's own default stands. */
        }

        /*
         * Whether the shell below is the right shape for where we are going.
         *
         * A chat-list skeleton over the sign-in screen would be a lie about
         * what is coming. On every other route the shell is the background and
         * nothing else, which is still better than white.
         */
        var path = location.pathname;
        if (/^\/(chats|calls|communities|notifications|profile|settings)/.test(path)) {
          document.documentElement.setAttribute('data-shell', 'list');
        }
      })();
    </script>

    <!--
      What fills the screen until React has mounted.

      `#root` was empty, so from the moment the HTML arrived to the moment a
      1.2 MB bundle finished parsing there was nothing on screen at all - white
      on a phone, for as long as that took. It is the most-seen screen in the
      product precisely because nobody meant to design it.

      Plain HTML and CSS, no script and no request: it is painted in the first
      frame, before the bundle has been asked for. React clears `#root` on its
      first render, so nothing removes this and there is no flash to time.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        background: #f7f7f8;
      }

      /*
       * A column, not the window.
       *
       * The list is the left pane on a desktop and the whole screen on a
       * phone, so the shell is one column that stops where that pane stops.
       * Stretched across 1500px it read as a broken table rather than as a
       * conversation list about to arrive.
       */
      #boot .col {
        width: 100%;
        max-width: 25rem;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.25rem 1rem;
        gap: 0.875rem;
      }

      :root[data-theme='dark'] #boot {
        background: #0c0d11;
      }

      /* Only the background where a list is not what is coming. */
      :root:not([data-shell='list']) #boot .col {
        display: none;
      }

      #boot i {
        display: block;
        position: relative;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(17, 17, 19, 0.06);
      }

      /*
       * The same sweep `.skeleton` draws in tokens.css, written out here
       * because that stylesheet is inside the bundle this is waiting for.
       * They have to match: React replaces these with its own placeholders the
       * instant it mounts, and a placeholder that changed its animation
       * mid-wait would announce the handover this exists to hide.
       */
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: boot-sweep 1.6s ease-in-out infinite;
      }

      :root[data-theme='dark'] #boot i::after {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.09), transparent);
      }

      :root[data-theme='dark'] #boot i {
        background: rgba(255, 255, 255, 0.07);
      }

      #boot .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #boot .row i:first-child {
        width: 2.75rem;
        height: 2.75rem;
        flex: none;
      }

      #boot .lines {
        flex: 1;
        display: grid;
        gap: 0.5rem;
      }

      /*
       * Staggered, because five bars lighting on the same frame read as one
       * object rather than as a list of separate things.
       */
      #boot .row:nth-child(3) i::after { animation-delay: 0.05s; }
      #boot .row:nth-child(4) i::after { animation-delay: 0.1s; }
      #boot .row:nth-child(5) i::after { animation-delay: 0.15s; }
      #boot .row:nth-child(6) i::after { animation-delay: 0.2s; }

      /* The pane's own edge, where there is a pane beside it. */
      @media (min-width: 64rem) {
        #boot .col { border-right: 1px solid rgba(17, 17, 19, 0.07); }
        :root[data-theme='dark'] #boot .col { border-right-color: rgba(255, 255, 255, 0.08); }
      }

      @keyframes boot-sweep {
        to { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot i::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React's first render. See the note in <head>. -->
      <div id="boot" aria-hidden="true">
        <div class="col">
          <i style="width: 7rem; height: 1.5rem; border-radius: 0.5rem"></i>
          <i style="width: 100%; height: 2.5rem; border-radius: 1.25rem"></i>
          <div class="row"><i></i><div class="lines"><i style="width: 55%; height: 0.8rem"></i><i style="width: 80%; height: 0.7rem"></i></div></div>
          <div class="row"><i></i><div class="lines"><i style="width: 45%; height: 0.8rem"></i><i style="width: 70%; height: 0.7rem"></i></div></div>
          <div class="row"><i></i><div class="lines"><i style="width: 62%; height: 0.8rem"></i><i style="width: 60%; height: 0.7rem"></i></div></div>
          <div class="row"><i></i><div class="lines"><i style="width: 48%; height: 0.8rem"></i><i style="width: 76%; height: 0.7rem"></i></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Recover from a stale shell.
       *
       * Observed in production: a cached index.html referencing
       * assets/index-CnNEDbzi.js, an asset a later deploy had removed. Pages
       * answers a missing file with the SPA fallback, so the browser fetched
       * 2,245 bytes of HTML where it expected a module, the script never ran,
       * and #root stayed empty. A white screen, and nothing in the console to
       * say why.
       *
       * Network-first navigations make it rarer, and cannot make it impossible:
       * on a connection slower than the timeout the service worker still falls
       * back to the shell it has, and that shell can name assets that no longer
       * exist. The only reliable signal is the one that matters anyway -- did
       * the app mount.
       *
       * If it did not, drop the caches and the worker and reload. Guarded by
       * sessionStorage so a genuinely broken build reloads once rather than
       * spinning, because a reload loop is worse than a white screen: it burns
       * battery and data and never stops.
       */
      (function () {
        var KEY = 'pingo:boot-retry';
        function mounted() {
          var root = document.getElementById('root');
          return !!root && root.childNodes.length > 0;
        }
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (mounted()) {
              sessionStorage.removeItem(KEY);
              return;
            }
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');

            var done = function () {
              location.reload();
            };
            var jobs = [];
            if (window.caches && caches.keys) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }),
              );
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (all) {
                  return Promise.all(all.map(function (r) { return r.unregister(); }));
                }),
              );
            }
            Promise.all(jobs).then(done, done);
          }, 5000);
        });
      })();
    </script>
  </body>
</html>
