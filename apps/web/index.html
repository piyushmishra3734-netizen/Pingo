      The name under the icon on an iPhone's home screen.

      iOS ignores the manifest's `short_name` and uses `<title>` unless this is

    <!--
      Space Grotesk is the brand face, served from our own origin.

      It used to come from fonts.googleapis.com, which meant Google received an
      IP address for every visitor on every cold load - before sign-in, before
      anything at all. On a product whose argument is that the middle is empty,
      that was the one request contradicting it, and the privacy policy would
      have had to list Google as a third party purely because of a typeface.

      Preloaded rather than merely linked: the @font-face lives in an imported
      stylesheet, so without this the browser cannot discover the font until CSS
      has parsed - a round trip that lands squarely in first paint. The latin
      subset only; the others are fetched on demand by their unicode-range and
      most sessions never need them.

      Licensed under the SIL Open Font License. See /fonts/OFL.txt.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

      because iOS composites transparency onto black and rounds the icon itself.

    <!--
      The theme, decided before the first pixel.

      `data-theme` is set by SettingsContext, which cannot run until React has
      mounted - so a reload painted the light palette and then turned dark once
      the bundle was parsed. Every deploy reloads the fleet (`autoUpdate` with
      `skipWaiting`), so this was fifteen flashes a day for anybody on dark.

      Reads the same key and the same rule the app does: an explicit choice
      wins, nothing chosen is light, and `auto` follows the system only for
      somebody who picked it. Wrapped because a browser refusing
      localStorage must cost the flash, not the app.
    -->
    <!--
      A Google sign-in that PINGO for Windows started.

      The desktop app sends Google's sign-in to the real browser (Google will
      not sign in inside an app's window), so the browser is where it comes
      back: /auth/google?code=... with no sign-in of its own waiting for that
      code. The code belongs to the desktop app, which stored the other half.
      Before the app here tries - and fails - to use it, it is handed over.
    -->
    <script>
      (function () {
        try {
          if (location.pathname !== '/auth/google' || !/[?&]code=/.test(location.search)) return;
          if (/Electron\//.test(navigator.userAgent)) return;
          if (localStorage.getItem('pingo.auth.session-code-verifier')) return;
          location.replace('/desktop-return.html' + location.search);
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pingo:preferences');
          var prefs = raw ? JSON.parse(raw) || {} : {};
          // Nested under `appearance`; the top-level read only ever found nothing.
          var theme = (prefs.appearance && prefs.appearance.theme) || prefs.theme || 'light';
          // Light until somebody picks dark: an `auto` saved before this was the
          // old default, not a choice (see migrateTheme in SettingsContext).
          if (theme === 'auto' && !localStorage.getItem('pingo:theme-light-default-v1')) theme = 'light';
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            var tint = document.querySelector('meta[name="theme-color"]');
            if (tint) tint.setAttribute('content', '#0c0d11');
          }
        } catch (error) {
          /* No preference readable. The stylesheet's own default stands. */
        }

        /*
         * Whether the shell below is the right shape for where we are going.
         *
         * A chat-list skeleton over the sign-in screen would be a lie about
         * what is coming. On every other route the shell is the background and
         * nothing else, which is still better than white.
         */
        var path = location.pathname;
        if (/^\/(chats|calls|communities|notifications|profile|settings)/.test(path)) {
          document.documentElement.setAttribute('data-shell', 'list');
        }
        // The launch splash, for opening the app - see #splash below.
        if (/^\/($|chats|calls|communities|notifications|profile|settings|camera|stories)/.test(path)) {
          document.documentElement.setAttribute('data-splash', '');
        }
      })();
    </script>

    <!--
      What fills the screen until React has mounted.

      `#root` was empty, so from the moment the HTML arrived to the moment a
      1.2 MB bundle finished parsing there was nothing on screen at all - white
      on a phone, for as long as that took. It is the most-seen screen in the
      product precisely because nobody meant to design it.

      Plain HTML and CSS, no script and no request: it is painted in the first
      frame, before the bundle has been asked for. React clears `#root` on its
      first render, so nothing removes this and there is no flash to time.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        background: #f7f7f8;
      }

      /*
       * A column, not the window.
       *
       * The list is the left pane on a desktop and the whole screen on a
       * phone, so the shell is one column that stops where that pane stops.
       * Stretched across 1500px it read as a broken table rather than as a
       * conversation list about to arrive.
       */
      #boot .col {
        width: 100%;
        max-width: 25rem;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1.25rem 1rem;
        gap: 0.875rem;
      }

      :root[data-theme='dark'] #boot {
        background: #0c0d11;
      }

      /* Only the background where a list is not what is coming. */
      :root:not([data-shell='list']) #boot .col {
        display: none;
      }

      #boot i {
        display: block;
        position: relative;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(17, 17, 19, 0.06);
      }

      /*
       * The same sweep `.skeleton` draws in tokens.css, written out here
       * because that stylesheet is inside the bundle this is waiting for.
       * They have to match: React replaces these with its own placeholders the
       * instant it mounts, and a placeholder that changed its animation
       * mid-wait would announce the handover this exists to hide.
       */
      #boot i::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: boot-sweep 1.6s ease-in-out infinite;
      }

      :root[data-theme='dark'] #boot i::after {
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.09), transparent);
      }

      :root[data-theme='dark'] #boot i {
        background: rgba(255, 255, 255, 0.07);
      }

      #boot .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #boot .row i:first-child {
        width: 2.75rem;
        height: 2.75rem;
        flex: none;
      }

      #boot .lines {
        flex: 1;
        display: grid;
        gap: 0.5rem;
      }

      /*
       * Staggered, because five bars lighting on the same frame read as one
       * object rather than as a list of separate things.
       */
      #boot .row:nth-child(3) i::after { animation-delay: 0.05s; }
      #boot .row:nth-child(4) i::after { animation-delay: 0.1s; }
      #boot .row:nth-child(5) i::after { animation-delay: 0.15s; }
      #boot .row:nth-child(6) i::after { animation-delay: 0.2s; }

      /* The pane's own edge, where there is a pane beside it. */
      @media (min-width: 64rem) {
        #boot .col { border-right: 1px solid rgba(17, 17, 19, 0.07); }
        :root[data-theme='dark'] #boot .col { border-right-color: rgba(255, 255, 255, 0.08); }
      }

      @keyframes boot-sweep {
        to { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot i::after { animation: none; }
      }
    </style>

    <!--
      The launch splash: the PINGO mark, and nothing else.

      Inline - the mark is part of this page, not a picture to fetch - so it is
      on screen in the first frame on any connection. It springs in; if the app
      is still opening after about a second, a light passes along the ribbon so
      it never looks frozen; and when the app is ready (features/loading/splash.ts
      decides that) the mark swells and the app shows through. There is no
      minimum time. The Android splash draws the same mark at the same size on
      the same ground, so the hand-over between them is invisible.

      Shown when the app is being opened - the root and the app's own screens -
      not over a legal page or a shared link somebody came to read.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #fbfbfe;
      }
      :root[data-theme='dark'] #splash { background: #111113; }
      :root:not([data-splash]) #splash { display: none; }

        position: relative;
        width: min(30vw, 30vh, 120px);
        aspect-ratio: 1;
        animation: splash-pop 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }

        background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.55) 50%, transparent 65%) no-repeat;

      }
      #splash.wait .sh { opacity: 1; animation: splash-pass 1.7s ease-in-out infinite; }

       * whatever is underneath is more use than a logo.
       */
      (function () {
        var el = document.getElementById('splash');
        var root = document.documentElement;
        var api = { gone: !root.hasAttribute('data-splash'), done: function () {} };
        window.__pingoSplash = api;
        if (api.gone) { el.remove(); return; }
        var wait = setTimeout(function () { el.classList.add('wait'); }, 900);
        api.done = function () {
          if (api.gone) return;
          api.gone = true;
          clearTimeout(wait);
          el.classList.remove('wait');
          el.classList.add('out');
          setTimeout(function () { el.remove(); root.removeAttribute('data-splash'); }, 460);
        };
        setTimeout(api.done, 15000);
      })();
    </script>

      <div id="boot" aria-hidden="true">

    <script>
      /*
       * Recover from a stale shell.
       *
       * Observed in production: a cached index.html referencing
       * assets/index-CnNEDbzi.js, an asset a later deploy had removed. Pages
       * answers a missing file with the SPA fallback, so the browser fetched
       * 2,245 bytes of HTML where it expected a module, the script never ran,
       * and #root stayed empty. A white screen, and nothing in the console to
       * say why.
       *
       * Network-first navigations make it rarer, and cannot make it impossible:
       * on a connection slower than the timeout the service worker still falls
       * back to the shell it has, and that shell can name assets that no longer
       * exist. The only reliable signal is the one that matters anyway -- did
       * the app mount.
       *
       * If it did not, drop the caches and the worker and reload. Guarded by
       * sessionStorage so a genuinely broken build reloads once rather than
       * spinning, because a reload loop is worse than a white screen: it burns
       * battery and data and never stops.
       */
      (function () {
        var KEY = 'pingo:boot-retry';
        function mounted() {
          var root = document.getElementById('root');
          return !!root && root.childNodes.length > 0;
        }
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (mounted()) {
              sessionStorage.removeItem(KEY);
              return;
            }
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');

            var done = function () {
              location.reload();
            };
            var jobs = [];
            if (window.caches && caches.keys) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }),
              );
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (all) {
                  return Promise.all(all.map(function (r) { return r.unregister(); }));
                }),
              );
            }
            Promise.all(jobs).then(done, done);
          }, 5000);
        });
      })();
    </script>
