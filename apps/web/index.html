    <!-- Tints browser chrome to the page colour so the app has no visible seam. -->
    <meta name="theme-color" content="#FBFBFE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Space Grotesk is the brand face, served from our own origin.

      It used to come from fonts.googleapis.com, which meant Google received an
      IP address for every visitor on every cold load - before sign-in, before
      anything at all. On a product whose argument is that the middle is empty,
      that was the one request contradicting it, and the privacy policy would
      have had to list Google as a third party purely because of a typeface.

      Preloaded rather than merely linked: the @font-face lives in an imported
      stylesheet, so without this the browser cannot discover the font until CSS
      has parsed - a round trip that lands squarely in first paint. The latin
      subset only; the others are fetched on demand by their unicode-range and
      most sessions never need them.

      Licensed under the SIL Open Font License. See /fonts/OFL.txt.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Hero mark used on public landing surfaces; warm the cache for LCP. -->
    <link rel="preload" href="/pingo-icon.png" as="image" type="image/png" />

    <!--
      The official artwork, used as supplied. Three files, all generated by
      `scripts/icons.mjs` from the one image, because the same picture is wrong
      in each of these places for a different reason.

      The tab takes the penguin alone. Cutting the paper away still leaves the
      tile, and the tile is a pale glass square - which in a tab is a white box
      with a bird in it, whatever the surrounding chrome is doing. Only the mark
      belongs there.

      `apple-touch-icon` takes the opaque, full-bleed copy. iOS ignores
      transparency here and composites onto black, so a transparent PNG arrives
      with black wedges in its corners - and iOS rounds the icon itself anyway,
      so the tile's own corners would be cropped twice.

      The social cards take the same opaque copy, for the same reason in a
      different setting: a transparent PNG lands on whatever colour the app
      showing the link happens to use.
    -->
    <link rel="icon" href="/pingo-favicon.png" type="image/png" sizes="512x512" />
    <link rel="icon" href="/pingo-favicon.png" type="image/png" sizes="any" />
    <link rel="shortcut icon" href="/pingo-favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/pingo-maskable.png" sizes="512x512" />

    <!-- JSON-LD: organization + software application (public product surface). -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Recover from a stale shell.
       *
       * Observed in production: a cached index.html referencing
       * assets/index-CnNEDbzi.js, an asset a later deploy had removed. Pages
       * answers a missing file with the SPA fallback, so the browser fetched
       * 2,245 bytes of HTML where it expected a module, the script never ran,
       * and #root stayed empty. A white screen, and nothing in the console to
       * say why.
       *
       * Network-first navigations make it rarer, and cannot make it impossible:
       * on a connection slower than the timeout the service worker still falls
       * back to the shell it has, and that shell can name assets that no longer
       * exist. The only reliable signal is the one that matters anyway -- did
       * the app mount.
       *
       * If it did not, drop the caches and the worker and reload. Guarded by
       * sessionStorage so a genuinely broken build reloads once rather than
       * spinning, because a reload loop is worse than a white screen: it burns
       * battery and data and never stops.
       */
      (function () {
        var KEY = 'pingo:boot-retry';
        function mounted() {
          var root = document.getElementById('root');
          return !!root && root.childNodes.length > 0;
        }
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (mounted()) {
              sessionStorage.removeItem(KEY);
              return;
            }
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');

            var done = function () {
              location.reload();
            };
            var jobs = [];
            if (window.caches && caches.keys) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }),
              );
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (all) {
                  return Promise.all(all.map(function (r) { return r.unregister(); }));
                }),
              );
            }
            Promise.all(jobs).then(done, done);
          }, 5000);
        });
      })();
    </script>
  </body>
</html>
