<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>PINGO — Connect. Privately.</title>
    <meta name="description" content="Private messaging, redefined for you." />

    <!-- Tints browser chrome to the page colour so the app has no visible seam. -->
    <meta name="theme-color" content="#FBFBFE" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Space Grotesk is the brand face, served from our own origin.

      It used to come from fonts.googleapis.com, which meant Google received an
      IP address for every visitor on every cold load — before sign-in, before
      anything at all. On a product whose argument is that the middle is empty,
      that was the one request contradicting it, and the privacy policy would
      have had to list Google as a third party purely because of a typeface.

      Preloaded rather than merely linked: the @font-face lives in an imported
      stylesheet, so without this the browser cannot discover the font until CSS
      has parsed — a round trip that lands squarely in first paint. The latin
      subset only; the others are fetched on demand by their unicode-range and
      most sessions never need them.

      Licensed under the SIL Open Font License. See /fonts/OFL.txt.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The official app icon, used as supplied. Not a redraw, not a generated
      size set — one file, referenced everywhere the mark appears.
    -->
    <link rel="icon" type="image/png" href="/pingo-icon.png" />
    <link rel="apple-touch-icon" href="/pingo-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
