// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        /*
         * Kotlin, for exactly one file.
         *
         * LiveKit's Android SDK is Kotlin with suspending functions, and
         * ScreenCaptureService has to call them. Doing that from Java means
         * hand-written continuations - the sort of code that is unreadable
         * whether or not it compiles. Everything else in this app stays Java.
         */
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
