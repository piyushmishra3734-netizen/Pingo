// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    /*
     * Declared here, not in variables.gradle.
     *
     * `apply from: "variables.gradle"` runs *after* this block - buildscript is
     * evaluated first, before the project has any of those properties - so
     * reading `$kotlinVersion` from it here fails the build outright with
     * "unknown property". Everything the classpath needs has to be defined in
     * the same block that uses it.
     */
    ext.kotlinVersion = '2.0.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        /*
         * Kotlin, for exactly one file.
         *
         * LiveKit's Android SDK is Kotlin with suspending functions, and
         * ScreenCaptureService has to call them. Doing that from Java means
         * hand-written continuations - the sort of code that is unreadable
         * whether or not it compiles. Everything else in this app stays Java.
         */
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        /*
         * JitPack, for one transitive dependency.
         *
         * livekit-android pulls in `com.github.davidliu:audioswitch` pinned to
         * a commit hash, and that is published on JitPack rather than Maven
         * Central. Without this the build fails resolving a library nothing in
         * this repo names, which is a confusing way to find out.
         */
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
