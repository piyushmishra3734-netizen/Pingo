     * Kotlin and LiveKit, both only for native screen capture.
     *
     * A phone cannot share its screen from the browser - Chrome on Android
     * ships getDisplayMedia and rejects every call to it - so MediaProjection
     * has to publish into the call itself, and that means the Android SDK.
     * See ScreenCaptureService.
     */
