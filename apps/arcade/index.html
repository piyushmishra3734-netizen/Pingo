<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0a14" />
    <title>PINGO Arcade</title>
    <style>
      /* The scene colour from the first byte, so there is never a white frame. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0a14;
        overscroll-behavior: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
      /* The 2D game, laid exactly over the cabinet's screen by game-host.js. */
      .game-screen {
        position: fixed;
        z-index: 1;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
      }
      .overlay {
        z-index: 2;
        position: fixed;
        left: 50%;
        bottom: max(20px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font: 500 15px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #f4f1fa;
        text-align: center;
        /* The overlay must never swallow a tap meant for the scene. */
        pointer-events: none;
      }
      /* The brawler's touch pad: phones only, at the bottom corners. */
      .pad {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(14px, env(safe-area-inset-bottom));
        z-index: 3;
        display: none;
        justify-content: space-between;
        padding: 0 max(14px, env(safe-area-inset-left));
        pointer-events: none;
      }
      @media (pointer: coarse) {
        .pad {
          display: flex;
        }
      }
      .pad-side {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .pad-btn {
        pointer-events: auto;
        width: 60px;
        height: 60px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 50%;
        background: rgba(13, 10, 20, 0.45);
        color: #fff;
        font: 700 18px system-ui, -apple-system, 'Segoe UI', sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .pad-btn.is-raised {
        margin-bottom: 34px;
      }
      .pad-btn.is-small {
        width: 48px;
        height: 48px;
        font-size: 15px;
      }
      .pad-btn.is-down {
        background: rgba(255, 255, 255, 0.32);
      }
      /* On foot: a thumb stick bottom left (phones only), the action button bottom right. */
      .stick {
        position: fixed;
        left: max(24px, env(safe-area-inset-left));
        bottom: max(24px, env(safe-area-inset-bottom));
        z-index: 3;
        display: none;
        width: 112px;
        height: 112px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        background: rgba(13, 10, 20, 0.35);
        touch-action: none;
      }
      @media (pointer: coarse) {
        .stick {
          display: block;
        }
      }
      .stick[hidden] {
        display: none;
      }
      .stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        margin: -24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        pointer-events: none;
      }
      .overlay-action {
        position: fixed;
        right: max(24px, env(safe-area-inset-right));
        bottom: max(32px, env(safe-area-inset-bottom));
        z-index: 3;
        min-height: 56px;
        padding: 0 28px;
        font: 600 17px system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .overlay[data-mode='walk'] {
        top: max(12px, env(safe-area-inset-top));
        bottom: auto;
      }
      /* During a game: out of the picture, top right, small. */
      .overlay[data-mode='game'] {
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        bottom: auto;
        left: auto;
        transform: none;
      }
      .overlay[data-mode='game'] .overlay-button {
        min-height: 36px;
        padding: 0 14px;
        font-size: 13px;
        background: rgba(13, 10, 20, 0.55);
      }
      .overlay-status {
        margin: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(13, 10, 20, 0.6);
        backdrop-filter: blur(8px);
      }
      .overlay-button {
        pointer-events: auto;
        min-height: 44px;
        padding: 0 22px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: inherit;
        font: inherit;
        backdrop-filter: blur(8px);
      }
      .overlay-button:focus-visible {
        outline: 2px solid #f4f1fa;
        outline-offset: 3px;
      }
      .overlay-invite {
        background: #f4f1fa;
        color: #120e1a;
        font-weight: 600;
      }
      .overlay-link {
        pointer-events: auto;
        width: min(86vw, 420px);
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        background: rgba(13, 10, 20, 0.8);
        color: inherit;
        font: 13px/1.3 ui-monospace, Menlo, monospace;
        user-select: all;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
