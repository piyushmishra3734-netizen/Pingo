<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0a14" />
    <title>PINGO Arcade</title>
    <style>
      /* The scene colour from the first byte, so there is never a white frame. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0a14;
        overscroll-behavior: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
