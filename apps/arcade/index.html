<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0a14" />
    <title>PINGO Arcade</title>
    <style>
      /* The scene colour from the first byte, so there is never a white frame. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d0a14;
        overscroll-behavior: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #stage {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
      .overlay {
        position: fixed;
        left: 50%;
        bottom: max(20px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        font: 500 15px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #f4f1fa;
        text-align: center;
        /* The overlay must never swallow a tap meant for the scene. */
        pointer-events: none;
      }
      .overlay-status {
        margin: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(13, 10, 20, 0.6);
        backdrop-filter: blur(8px);
      }
      .overlay-button {
        pointer-events: auto;
        min-height: 44px;
        padding: 0 22px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: inherit;
        font: inherit;
        backdrop-filter: blur(8px);
      }
      .overlay-button:focus-visible {
        outline: 2px solid #f4f1fa;
        outline-offset: 3px;
      }
      .overlay-invite {
        background: #f4f1fa;
        color: #120e1a;
        font-weight: 600;
      }
      .overlay-link {
        pointer-events: auto;
        width: min(86vw, 420px);
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 12px;
        background: rgba(13, 10, 20, 0.8);
        color: inherit;
        font: 13px/1.3 ui-monospace, Menlo, monospace;
        user-select: all;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
